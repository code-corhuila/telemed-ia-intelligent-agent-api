name: CI

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout API
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Build the image
        run: docker build -f deploy/Dockerfile -t telemed-ia-intelligent-agent-api:ci .
